      migrate:
        condition: service_completed_successfully
    networks:
      - elysia-net

  svc-properties:
    <<: *service-defaults
    command: ["bun", "run", "src/pages/properties/index.ts"]
    ports:
      - "${PORT_PROPERTIES:-3003}:3003"
    environment:
      <<: *common-env
      PORT_PROPERTIES: 3003
