version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Elysia Real Estate API — Full Docker Compose
#  22 microservices + PostgreSQL
#
#  Quick start:
#    cp .env.example .env        # fill in JWT_SECRET
#    docker compose up -d        # start everything
#    docker compose logs -f      # tail logs
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgresql://elysia:elysia_pass@postgres:5432/elysia_db
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  NODE_ENV: ${NODE_ENV:-production}

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    <<: *common-env
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  stop_grace_period: 30s
  mem_limit: 512M
  memswap_limit: 768M

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia_pass
      POSTGRES_DB: elysia_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elysia-net

  # ── DB Migration (runs once, then exits) ───────────────────────────────────
  migrate:
    <<: *service-defaults
    command: ["bunx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"
    networks:
      - elysia-net

  # ── API Gateway (monolith — all routes on one port) ────────────────────────
  gateway:
    <<: *service-defaults
    command: ["bun", "run", "src/index.ts"]
    ports:
      - "${PORT_GATEWAY:-3000}:3000"
    environment:
      <<: *common-env
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - elysia-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"

  # ── Microservices ──────────────────────────────────────────────────────────
  svc-auth:
    <<: *service-defaults
    command: ["bun", "run", "src/pages/auth/index.ts"]
    ports:
      - "${PORT_AUTH:-3001}:3001"
    environment:
      <<: *common-env
      PORT_AUTH: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - elysia-net

  svc-organizations:
    <<: *service-defaults
    command: ["bun", "run", "src/pages/organizations/index.ts"]
    ports:
      - "${PORT_ORGANIZATIONS:-3002}:3002"
