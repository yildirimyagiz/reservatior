<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 210mm 297mm; margin: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; width: 210mm; height: 297mm; display: flex; flex-direction: column; color: #333; background: #fff; }
        .header { height: 50%; position: relative; }
        .header img { width: 100%; height: 100%; object-fit: cover; }
        .header-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; color: white; }
        .header-overlay h1 { font-size: 48px; font-weight: 900; margin: 0; }
        .header-overlay p { font-size: 18px; }
        .content { flex-grow: 1; padding: 40px; }
        .main-content { display: flex; gap: 30px; }
        .left-panel { width: 60%; }
        .right-panel { width: 40%; }
        h2 { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        p { line-height: 1.6; }
        .features { list-style: none; padding: 0; margin-top: 20px; display: flex; justify-content: space-between; text-align: center; }
        .features li { border-left: 1px solid #ddd; flex-grow: 1; padding: 0 15px; }
        .features li:first-child { border-left: none; }
        .feature-value { font-size: 24px; font-weight: bold; }
        .feature-label { font-size: 12px; color: #888; }
        .agent-footer { display: flex; align-items: center; gap: 15px; padding: 20px 40px; border-top: 1px solid #eee; }
        .agent-photo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .agent-details p { margin: 0; }
        .agent-name { font-weight: bold; }
        .logo { margin-left: auto; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <img src="data:image/jpeg;base64,{{ photos[0] }}">
        <div class="header-overlay">
            <h1>{{ title }}</h1>
            <p>{{ address }}</p>
        </div>
    </div>
    <div class="content">
        <div class="main-content">
            <div class="left-panel">
                <h2>PROPERTY DESCRIPTION</h2>
                <p>{{ description }}</p>
            </div>
            <div class="right-panel">
                <h2>DETAILS</h2>
                <ul class="features">
                    <li><p class="feature-value">{{ bedrooms }}</p><p class="feature-label">Beds</p></li>
                    <li><p class="feature-value">{{ bathrooms }}</p><p class="feature-label">Baths</p></li>
                    <li><p class="feature-value">{{ area }}</p><p class="feature-label">sq ft</p></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="agent-footer">
        <img src="data:image/jpeg;base64,{{ agent_photo }}" class="agent-photo">
        <div class="agent-details">
            <p class="agent-name">{{ agent_name }}</p>
            <p>{{ agent_email }} | {{ agent_phone }}</p>
        </div>
        <p class="logo">{{ company_name }}</p>
    </div>
</body>
</html>
