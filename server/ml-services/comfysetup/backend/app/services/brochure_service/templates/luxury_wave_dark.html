<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 210mm 297mm; margin: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; width: 210mm; height: 297mm; display: flex; flex-direction: column; color: #fff; background: #1a1a1a; }
        .header { height: 50%; position: relative; }
        .header img { width: 100%; height: 100%; object-fit: cover; }
        .wave { position: absolute; bottom: -1px; left: 0; width: 100%; height: 100px; background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231a1a1a" fill-opacity="1" d="M0,128L80,149.3C160,171,320,213,480,208C640,203,800,149,960,138.7C1120,128,1280,160,1360,176L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path></svg>'); background-size: cover; }
        .content { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 48px; font-weight: 900; margin: 0 0 10px 0; }
        .address { font-size: 18px; color: #ccc; }
        .price { font-size: 36px; font-weight: 100; color: #D4AF37; margin-top: 20px; }
        .features { list-style: none; padding: 0; margin-top: 20px; columns: 2; }
        .features li { margin-bottom: 8px; }
        .agent-footer { display: flex; align-items: center; gap: 15px; padding: 20px 40px; background: #2a2a2a; }
        .agent-photo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .agent-details p { margin: 0; }
        .agent-name { font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <img src="data:image/jpeg;base64,{{ photos[0] }}">
        <div class="wave"></div>
    </div>
    <div class="content">
        <h1>{{ title }}</h1>
        <p class="address">{{ address }}</p>
        <p class="price">Offered at ${{ price }}</p>
        <ul class="features">
            <li>{{ bedrooms }} Bedrooms</li>
            <li>{{ bathrooms }} Bathrooms</li>
            <li>{{ area }} sq ft</li>
            <li>Built in {{ yearBuilt }}</li>
        </ul>
    </div>
    <div class="agent-footer">
        <img src="data:image/jpeg;base64,{{ agent_photo }}" class="agent-photo">
        <div class="agent-details">
            <p class="agent-name">{{ agent_name }}</p>
            <p>{{ agent_email }} | {{ agent_phone }}</p>
        </div>
    </div>
</body>
</html>
