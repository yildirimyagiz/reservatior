<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 210mm 297mm; margin: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; width: 210mm; height: 297mm; display: flex; color: #333; }
        .sidebar { width: 38%; background: #f8f8f8; padding: 30px; display: flex; flex-direction: column; }
        .gallery-container { width: 62%; display: flex; flex-direction: column; }
        .header { padding: 30px; }
        .header h1 { font-size: 32px; font-weight: 900; margin: 0 0 5px 0; letter-spacing: 1px; }
        .header .event-details { font-size: 16px; }
        .property-info { padding: 0 30px; }
        .property-info p { margin: 0 0 20px 0; line-height: 1.6; }
        .features { list-style: none; padding: 0; margin-bottom: 20px; columns: 2; }
        .features li { margin-bottom: 8px; }
        .price { font-size: 28px; font-weight: 100; margin-bottom: 20px; }
        .agent-footer { margin-top: auto; display: flex; align-items: center; gap: 15px; padding-top: 20px; border-top: 1px solid #ddd; }
        .agent-photo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .agent-details p { margin: 0; }
        .agent-name { font-weight: bold; }
        .main-image-container { height: 55%; }
        .main-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .thumbnail-gallery { height: 45%; padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 15px; }
        .thumbnail-gallery img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h1>OPEN HOUSE</h1>
            <p class="event-details">Monday, May 15 | 11am - 2pm</p>
        </div>
        <div class="property-info">
            <p>{{ description }}</p>
            <ul class="features">
                <li>{{ area }} sq ft</li>
                <li>{{ bedrooms }} Bedrooms</li>
                <li>{{ bathrooms }} Bathrooms</li>
                <li>Built in {{ yearBuilt }}</li>
                <li>4-Car Garage</li>
                <li>Central A/C</li>
            </ul>
            <p class="price">Offered at ${{ price }}</p>
        </div>
        <div class="agent-footer">
            <img src="data:image/jpeg;base64,{{ agent_photo }}" class="agent-photo">
            <div class="agent-details">
                <p class="agent-name">{{ agent_name }}</p>
                <p>{{ agent_email }}</p>
                <p>{{ agent_phone }}</p>
            </div>
        </div>
    </div>
    <div class="gallery-container">
        <div class="main-image-container">
            <img src="data:image/jpeg;base64,{{ photos[0] }}">
        </div>
        <div class="thumbnail-gallery">
            <img src="data:image/jpeg;base64,{{ photos[1] }}">
            <img src="data:image/jpeg;base64,{{ photos[2] }}">
            <img src="data:image/jpeg;base64,{{ photos[3] }}">
            <img src="data:image/jpeg;base64,{{ photos[4] }}">
        </div>
    </div>
</body>
</html>
