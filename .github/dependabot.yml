# ── Dependabot Configuration — Reservatior ─────────────────────────────────
# Keeps dependencies up-to-date and alerts on vulnerable packages.
# ───────────────────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "next"
      - dependency-name: "typescript"
    groups:
      production-deps:
        dependency-type: "production"
        patterns: ["*"]
      dev-deps:
        dependency-type: "development"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(server)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/client-seo"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(client-seo)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "docker"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
      - "security"
