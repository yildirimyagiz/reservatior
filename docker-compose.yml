services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reservatior
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Base / Default
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/realestate_us
      # USA
      - DATABASE_URL_US=postgresql://postgres:postgres@db:5432/realestate_us
      # Europe
      - DATABASE_URL_UK=postgresql://postgres:postgres@db:5432/realestate_uk
      - DATABASE_URL_TR=postgresql://postgres:postgres@db:5432/realestate_tr
      - DATABASE_URL_DE=postgresql://postgres:postgres@db:5432/realestate_de
      - DATABASE_URL_FR=postgresql://postgres:postgres@db:5432/realestate_fr
      - DATABASE_URL_ES=postgresql://postgres:postgres@db:5432/realestate_es
      - DATABASE_URL_IT=postgresql://postgres:postgres@db:5432/realestate_it
      - DATABASE_URL_NL=postgresql://postgres:postgres@db:5432/realestate_nl
      # Americas
      - DATABASE_URL_CA=postgresql://postgres:postgres@db:5432/realestate_ca
      - DATABASE_URL_MX=postgresql://postgres:postgres@db:5432/realestate_mx
      - DATABASE_URL_BR=postgresql://postgres:postgres@db:5432/realestate_br
      - DATABASE_URL_AR=postgresql://postgres:postgres@db:5432/realestate_ar
      # Asia-Pacific
      - DATABASE_URL_AU=postgresql://postgres:postgres@db:5432/realestate_au
      - DATABASE_URL_NZ=postgresql://postgres:postgres@db:5432/realestate_nz
      - DATABASE_URL_JP=postgresql://postgres:postgres@db:5432/realestate_jp
      - DATABASE_URL_KR=postgresql://postgres:postgres@db:5432/realestate_kr
      - DATABASE_URL_CN=postgresql://postgres:postgres@db:5432/realestate_cn
      - DATABASE_URL_IN=postgresql://postgres:postgres@db:5432/realestate_in
      - DATABASE_URL_SG=postgresql://postgres:postgres@db:5432/realestate_sg
      - DATABASE_URL_MY=postgresql://postgres:postgres@db:5432/realestate_my
      - DATABASE_URL_TH=postgresql://postgres:postgres@db:5432/realestate_th
      # Middle East
      - DATABASE_URL_AE=postgresql://postgres:postgres@db:5432/realestate_ae
      - DATABASE_URL_SA=postgresql://postgres:postgres@db:5432/realestate_sa
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      - server

volumes:
  pgdata:
