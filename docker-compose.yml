services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=elysia
      - POSTGRES_PASSWORD=elysia_pass
      - POSTGRES_DB=realestate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservatior-db-net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservatior-db-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASES_HOST=db
      - DATABASES_PORT=5432
      - DATABASES_USER=elysia
      - DATABASES_PASSWORD=elysia_pass
      - DATABASES_DB=realestate
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - SERVER_IDLE_TIMEOUT=600
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - DATABASE_URLS=postgresql://elysia:elysia_pass@db:5432/realestate,postgresql://elysia:elysia_pass@db:5432/realestate_us,postgresql://elysia:elysia_pass@db:5432/realestate_uk,postgresql://elysia:elysia_pass@db:5432/realestate_tr,postgresql://elysia:elysia_pass@db:5432/realestate_de,postgresql://elysia:elysia_pass@db:5432/realestate_fr,postgresql://elysia:elysia_pass@db:5432/realestate_es,postgresql://elysia:elysia_pass@db:5432/realestate_it,postgresql://elysia:elysia_pass@db:5432/realestate_nl,postgresql://elysia:elysia_pass@db:5432/realestate_ca,postgresql://elysia:elysia_pass@db:5432/realestate_mx,postgresql://elysia:elysia_pass@db:5432/realestate_br,postgresql://elysia:elysia_pass@db:5432/realestate_ar,postgresql://elysia:elysia_pass@db:5432/realestate_au,postgresql://elysia:elysia_pass@db:5432/realestate_nz,postgresql://elysia:elysia_pass@db:5432/realestate_jp,postgresql://elysia:elysia_pass@db:5432/realestate_kr,postgresql://elysia:elysia_pass@db:5432/realestate_cn,postgresql://elysia:elysia_pass@db:5432/realestate_in,postgresql://elysia:elysia_pass@db:5432/realestate_sg,postgresql://elysia:elysia_pass@db:5432/realestate_my,postgresql://elysia:elysia_pass@db:5432/realestate_th,postgresql://elysia:elysia_pass@db:5432/realestate_ae,postgresql://elysia:elysia_pass@db:5432/realestate_sa
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U elysia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservatior-db-net

  server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - RATE_LIMIT_API=${RATE_LIMIT_API:-200}
      - RATE_LIMIT_READ=${RATE_LIMIT_READ:-500}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10}
      - RATE_LIMIT_HEAVY=${RATE_LIMIT_HEAVY:-30}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate
      - DATABASE_URL_US=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_us
      - DATABASE_URL_UK=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_uk
      - DATABASE_URL_TR=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_tr
      - DATABASE_URL_DE=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_de
      - DATABASE_URL_FR=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_fr
      - DATABASE_URL_ES=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_es
      - DATABASE_URL_IT=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_it
      - DATABASE_URL_NL=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_nl
      - DATABASE_URL_CA=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_ca
      - DATABASE_URL_MX=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_mx
      - DATABASE_URL_BR=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_br
      - DATABASE_URL_AR=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_ar
      - DATABASE_URL_AU=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_au
      - DATABASE_URL_NZ=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_nz
      - DATABASE_URL_JP=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_jp
      - DATABASE_URL_KR=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_kr
      - DATABASE_URL_CN=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_cn
      - DATABASE_URL_IN=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_in
      - DATABASE_URL_SG=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_sg
      - DATABASE_URL_MY=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_my
      - DATABASE_URL_TH=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_th
      - DATABASE_URL_AE=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_ae
      - DATABASE_URL_SA=postgresql://elysia:elysia_pass@pgbouncer:6432/realestate_sa
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - reservatior-db-net
      - reservatior-api-net
      - easypanel

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_INTERNAL_URL: http://server:3000
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://reservatior.com
      - BACKEND_INTERNAL_URL=http://server:3000
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./server/data/TURKİYE/ISTANBUL:/app/public/videos/istanbul:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - reservatior-api-net
      - reservatior-frontend-net
      - easypanel

  nginx-ssl:
    profiles: ["ssl"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    networks:
      - reservatior-frontend-net

  certbot:
    profiles: ["ssl"]
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/log/letsencrypt:/var/log/letsencrypt
    entrypoint: >
      sh -c "
        trap exit TERM;
        while true; do
          certbot renew --quiet --no-self-upgrade;
          sleep 43200;
        done
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  reservatior-db-net:
    driver: bridge
    internal: true
  reservatior-api-net:
    driver: bridge
  reservatior-frontend-net:
    driver: bridge
  easypanel:
    external: true

volumes:
  pgdata:
  redisdata:
