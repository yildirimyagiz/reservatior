# ── Fail2Ban Jail for Nginx — Reservatior ───────────────────────────────────
# Copy to /etc/fail2ban/jail.d/reservatior.conf on the VPS
# ─────────────────────────────────────────────────────────────────────────────

[nginx-auth]
enabled  = true
port     = http,https
filter   = nginx-auth
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 300
bantime  = 86400
action   = iptables-multiport[name=Auth, port="http,https", protocol=tcp]

[nginx-badbots]
enabled  = true
port     = http,https
filter   = nginx-badbots
logpath  = /var/log/nginx/access.log
maxretry = 1
findtime = 86400
bantime  = 2592000

[nginx-rate-limit]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
maxretry = 3
findtime = 600
bantime  = 3600
