# ── Fail2Ban Filter: Nginx Auth Failures ────────────────────────────────────
# Copy to /etc/fail2ban/filter.d/nginx-auth.conf
# ─────────────────────────────────────────────────────────────────────────────

[Definition]
failregex = ^<HOST> -.* "(GET|POST).* (/login|signup|forgot-password|verify-email).*" 40[13]
            ^<HOST> -.* "(GET|POST).* /auth/.*" 40[13]
            ^<HOST> -.* 429

ignoreregex =
