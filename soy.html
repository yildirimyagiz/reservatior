      function detectGender(rawName) {
        if (!rawName) return "male";
        const norm = rawName
          .replace(/I/g, "ı")
          .replace(/İ/g, "i")
          .toLowerCase()
          .replace(/i̇/g, "i");
        for (const f of extraFemales) {
          if (norm.includes(f)) return "female";
        }
        const parts = norm.split(/[\s\/\(\)\-,]+/).filter(Boolean);
        for (const p of parts) {
          if (FEMALE_SET.has(p)) return "female";
        }
        for (const f of FEMALE_SET) {
          if (norm.includes(f)) return "female";
        }
        return "male";
      }

      // ══════════ KUSURSUZ VEKTÖREL MATEMATİK MOTORU ══════════
      const CARD_W = 160;
      const CARD_H = 75;
      const SPOUSE_GAP = 6;
      const HORIZ_GAP = 24;
      const VERT_GAP = 65;

      function measureTree(node, depth = 0) {
        let cardPairWidth = CARD_W;
        if (node.esi) {
          cardPairWidth = CARD_W * 2 + SPOUSE_GAP;
        }

        if (!node.cocuklari || node.cocuklari.length === 0) {
          return {
            totalW: cardPairWidth,
            cardPairW: cardPairWidth,
            depth: depth,
            children: [],
          };
        }

        let totalChildrenW = 0;
        const measuredChildren = node.cocuklari.map((child) => {
          return measureTree(child, depth + 1);
        });

        measuredChildren.forEach((ch, idx) => {
          totalChildrenW += ch.totalW;
          if (idx < measuredChildren.length - 1) {
            totalChildrenW += HORIZ_GAP;
          }
        });

        return {
          totalW: Math.max(cardPairWidth, totalChildrenW),
          cardPairW: cardPairWidth,
          depth: depth,
          children: measuredChildren,
        };
      }

    .title-sub { font-family: 'Josefin Sans', sans-serif; font-size: 12px; letter-spacing: 6px; fill: #6b6454; text-anchor: middle; }
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <text x="${width / 2}" y="65" class="title-main">Sarı İbrahimoğulları</text>
  <text x="${width / 2}" y="88" class="title-sub">KADİM AİLE SOY AĞACI ARŞİVİ</text>
  <line x1="${width / 2 - 300}" y1="105" x2="${width / 2 + 300}" y2="105" stroke="#c9a84c" stroke-opacity="0.3"/>`;

        function drawNode(node, measured, startX, y) {
          const centerX = startX + measured.totalW / 2;
          const pairLeftX = centerX - measured.cardPairW / 2;

          const gender = detectGender(node.ad);
          const isAnc = measured.depth <= 2;

          // Ana Kart Çizimi
          svg += `\n<g>`;
          svg += `<rect x="${pairLeftX}" y="${y}" width="${CARD_W}" height="${CARD_H}" class="card-rect ${isAnc ? "anc" : gender}"/>`;
          svg += `<rect x="${pairLeftX}" y="${y}" width="${CARD_W}" height="4" class="top-bar ${isAnc ? "anc" : gender}"/>`;

          // İsim kırma ve yazma algoritması
          const words = node.ad.split(" ");
          if (words.length > 2) {
            const mid = Math.ceil(words.length / 2);
            svg += `<text x="${pairLeftX + CARD_W / 2}" y="${y + 32}" class="text-name ${isAnc ? "anc" : ""}">${words.slice(0, mid).join(" ")}</text>`;
            svg += `<text x="${pairLeftX + CARD_W / 2}" y="${y + 46}" class="text-name ${isAnc ? "anc" : ""}">${words.slice(mid).join(" ")}</text>`;
          } else {
            svg += `<text x="${pairLeftX + CARD_W / 2}" y="${y + 38}" class="text-name ${isAnc ? "anc" : ""}">${node.ad}</text>`;
          }

          if (node.tarih) {
            svg += `<text x="${pairLeftX + CARD_W / 2}" y="${y + 63}" class="text-year">${node.tarih}</text>`;
          }
          svg += `</g>`;

          // Eş Kartı Çizimi
          if (node.esi) {
            const spouseX = pairLeftX + CARD_W + SPOUSE_GAP;
            const sGender = detectGender(node.esi);
            svg += `\n<g>`;
            svg += `<rect x="${spouseX}" y="${y}" width="${CARD_W}" height="${CARD_H}" class="card-rect ${isAnc ? "anc" : sGender}"/>`;
            svg += `<rect x="${spouseX}" y="${y}" width="${CARD_W}" height="4" class="top-bar ${isAnc ? "anc" : sGender}"/>`;
            svg += `<text x="${spouseX + CARD_W / 2}" y="${y + 42}" class="text-name ${isAnc ? "anc" : ""}">${node.esi}</text>`;
            svg += `<text x="${pairLeftX + CARD_W + SPOUSE_GAP / 2}" y="${y + 43}" class="text-plus">+</text>`;
            svg += `</g>`;
          }

          // Çocuk Bağlantı Çizgileri (Kusursuz Vektör)
          if (node.cocuklari && node.cocuklari.length > 0) {
            const bottomLineY = y + CARD_H;
            const middleJoinY = bottomLineY + VERT_GAP / 2;
            const nextGenY = y + CARD_H + VERT_GAP;

            // Merkez iniş çizgisi
            svg += `\n<line x1="${centerX}" y1="${bottomLineY}" x2="${centerX}" y2="${middleJoinY}" class="line-con"/>`;

            let childX = startX;
            const childPositions = [];

            node.cocuklari.forEach((child, idx) => {
              const childM = measured.children[idx];
              const childCenterX = childX + childM.totalW / 2;
              childPositions.push(childCenterX);

              // Çocuk dikey çıkış çizgisi
              svg += `<line x1="${childCenterX}" y1="${middleJoinY}" x2="${childCenterX}" y2="${nextGenY}" class="line-con"/>`;

              drawNode(child, childM, childX, nextGenY);
              childX += childM.totalW + HORIZ_GAP;
            });

            // Yatay köprü çizgisi (H-bar)
            if (childPositions.length > 1) {
              svg += `<line x1="${childPositions[0]}" y1="${middleJoinY}" x2="${childPositions[childPositions.length - 1]}" y2="${middleJoinY}" class="line-con"/>`;
            }
          }
        }

        measuredRoots.forEach((m, idx) => {
          drawNode(DATA[idx], m, currentX, startY);
          currentX += m.totalW + 120;
        });

        svg += "\n</svg>";
        return { svgString: svg, width: width, height: height };
      }

      // Ekran Görünümünü İlk Açılışta Oluşturma
      const targetContainer = document.getElementById("canvas-render-target");
      const res = generateSVGString();
      targetContainer.innerHTML = res.svgString;
      targetContainer.style.width = res.width + "px";
      targetContainer.style.height = res.height + "px";

      // ══════════ MATBAAYA TAM UYUMLU DOĞRUDAN PDF ÇIKTI ALMA ══════════
      function generatePerfectPDF() {
        const perfect = generateSVGString();
        const blob = new Blob([perfect.svgString], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.width = perfect.width;
        img.height = perfect.height;

        img.onload = function () {
          const canvas = document.createElement("canvas");
          canvas.width = perfect.width;
          canvas.height = perfect.height;
          const ctx = canvas.getContext("2d");

          // Yüksek Çözünürlüklü Arka Plan Kaplaması
          ctx.fillStyle = "#06060c";
          ctx.fillRect(0, 0, perfect.width, perfect.height);
          ctx.drawImage(img, 0, 0, perfect.width, perfect.height);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL("image/png");
          const { jsPDF } = window.jspdf;

          // Matbaacının İstediği Gerçek Kusursuz Ebat: 120cm x 80cm
          const pdf = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: [1200, 800],
          });

          // Sıfır kayma, sıfır ezilme ile tam alan kaplama basımı
          pdf.addImage(pngUrl, "PNG", 0, 0, 1200, 800, undefined, "NONE");
          pdf.save("Sari_Ibrahimogullari_Baski_Hazir_120x80cm.pdf");
        };
        img.src = url;
      }
    </script>
  </body>
