events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance tuning ─────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    keepalive_requests 100;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # General API: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # Auth endpoints: 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # Search/heavy endpoints: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=30r/m;
    # Burst protection: track connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Slowloris protection ───────────────────────────────────────────────────
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 10m;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/ld+json image/svg+xml;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=32k;
    error_log /var/log/nginx/error.log warn;

    # ── SSL (termination at nginx) ─────────────────────────────────────────────
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # ssl_session_tickets off;
    # ssl_buffer_size 4k;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ───────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Rate limiting: Auth endpoints ──────────────────────────────────
        location ~ ^/(auth|login|signup|forgot-password|verify-email)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            proxy_pass http://backend-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Rate limiting: Search/heavy endpoints ──────────────────────────
        location ~ ^/(search|api/search|api/valuation|api/recommendations)/ {
            limit_req zone=search_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://backend-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Rate limiting: General API ─────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://backend-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ── SPA (React Router) ─────────────────────────────────────────────
        location / {
            limit_conn conn_limit 50;
            try_files $uri $uri/ /index.html;
        }

        # ── Static assets caching ──────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* \.(json|xml|txt)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }

        # ── Deny access to hidden files ────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Deny access to sensitive files ─────────────────────────────────
        location ~ (\.env|\.git|composer\.json|package\.json|yarn\.lock)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ── Rate limiting response handling ────────────────────────────────────────
    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstream backend (load balancing / failover) ────────────────────────────
    upstream backend-service {
        server backend-service:3000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }
}
