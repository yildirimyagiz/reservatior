[package]
name = "security-os-dashboard-response"
version = "0.1.0"
edition = "2021"

[dependencies]
security-os-core = { path = "../../core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde_json = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
