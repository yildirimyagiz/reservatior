[package]
name = "security-os-plugins"
version = "0.1.0"
edition = "2021"

[dependencies]
security-os-core = { path = "../core" }
security-os-proto = { path = "../proto" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
