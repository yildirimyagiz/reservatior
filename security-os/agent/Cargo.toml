[package]
name = "security-os-agent"
version = "0.1.0"
edition = "2021"
description = "Reservatior Security OS - Endpoint Agent"

[[bin]]
name = "reservatior-agent"
path = "src/main.rs"

[dependencies]
security-os-core = { path = "../core" }
security-os-eventbus = { path = "../eventbus", features = ["local"] }
security-os-normalizer = { path = "../normalizer" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
hostname = "0.4"
