[workspace]
resolver = "2"
members = [
    # Core
    "core",
    "normalizer",
    "eventbus",
    "agent",
    "storage",

    # Collectors - Endpoint
    "collectors/process",
    "collectors/network",
    "collectors/filesystem",
    "collectors/container",
    "collectors/audit",
    "collectors/systemd",
    "collectors/ssh",
    "collectors/kernel",
    "collectors/dns",
    "collectors/tls",
    "collectors/jwt",
    "collectors/cron",
    "collectors/sudo",
    "collectors/selinux",
    "collectors/memory",
    "collectors/gpu",

    # Collectors - Cloud & Kubernetes
    "collectors/kubernetes",

    # Collectors - Business
    "collectors/reservatior",

    # Detection Engines
    "engines/process",
    "engines/network",
    "engines/filesystem",
    "engines/container",
    "engines/auth",
    "engines/api",
    "engines/secrets",
    "engines/cloud",
    "engines/config_drift",
    "engines/behavior",
    "engines/identity",
    "engines/ssh",
    "engines/kubernetes",
    "engines/ransomware",
    "engines/lateral_movement",
    "engines/persistence",
    "engines/privilege_escalation",
    "engines/data_exfiltration",
    "engines/webshell",
    "engines/insider_threat",
    "engines/supply_chain",
    "engines/binary_reputation",
    "engines/injection",
    "engines/llm_abuse",

    # Intelligence & Analytics
    "rule",
    "ioc",
    "risk",
    "ai",
    "correlation",

    # v3.0 Detection & Analysis
    "detection-dsl",
    "vulnerability",
    "malware",
    "knowledge-graph",
    "detection-cache",

    # v3.0 Intelligence & AI
    "threat-intel",
    "ai-memory",
    "ai-multiagent",

    # v3.0 Operations
    "fleet",
    "soar",
    "identity",

    # v3.0 Enterprise
    "multi-region",
    "datalake",
    "ebpf",

    # Infrastructure
    "api",
    "dashboard/response",
    "cli",
    "sdk",
    "proto",
    "plugins",
    "storage/clickhouse",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
md5 = "0.7"
sha1 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
