[package]
name = "security-os-collector-kubernetes"
version = "0.1.0"
edition = "2021"

[dependencies]
security-os-core = { path = "../../core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde_json = "1"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
