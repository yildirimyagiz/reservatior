# Google Cloud Build configuration for Free Tier optimization

steps:
  # Build API service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'server/Dockerfile', '-t', 'gcr.io/$PROJECT_ID/reservatior-api:$BUILD_ID', './server']
    id: 'build-api'
    timeout: '1800s'

  # Build Frontend service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.frontend', '-t', 'gcr.io/$PROJECT_ID/reservatior-frontend:$BUILD_ID', '.']
    id: 'build-frontend'
    timeout: '1200s'

  # Build ML service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.ml', '-t', 'gcr.io/$PROJECT_ID/reservatior-ml:$BUILD_ID', './server/ml-services/backend']
    id: 'build-ml'
    timeout: '1800s'
  
  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/reservatior-api:$BUILD_ID']
    id: 'push-api'
    waitFor: ['build-api']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/reservatior-frontend:$BUILD_ID']
    id: 'push-frontend'
    waitFor: ['build-frontend']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/reservatior-ml:$BUILD_ID']
    id: 'push-ml'
    waitFor: ['build-ml']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'reservatior-api'
      - '--image=gcr.io/$PROJECT_ID/reservatior-api:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-api'
    waitFor: ['push-api']
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'reservatior-frontend'
      - '--image=gcr.io/$PROJECT_ID/reservatior-frontend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'reservatior-ml'
      - '--image=gcr.io/$PROJECT_ID/reservatior-ml:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--timeout=300'
    id: 'deploy-ml'
    waitFor: ['push-ml']

images:
  - 'gcr.io/$PROJECT_ID/reservatior-api:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/reservatior-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/reservatior-ml:$BUILD_ID'

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 200
