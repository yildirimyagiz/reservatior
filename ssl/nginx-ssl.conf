# ── SSL termination nginx — sits in front of the client SPA ─────────────────
# Used by the ssl-router service in docker-compose.ssl.yml
# Certificates are managed by certbot and mounted at /etc/letsencrypt/

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Rate limiting ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── SSL ──────────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # ── OCSP Stapling ────────────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Logging ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log main buffer=32k;
    error_log /var/log/nginx/error.log warn;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name reservatior.com www.reservatior.com
                    atlasvs.cloud www.atlasvs.cloud;
        return 301 https://$server_name$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name reservatior.com www.reservatior.com
                    atlasvs.cloud www.atlasvs.cloud;

        # SSL certs (mounted from certbot)
        ssl_certificate     /etc/letsencrypt/live/reservatior.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reservatior.com/privkey.pem;

        # ── Security headers ─────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Rate limiting by path ─────────────────────────────────────
        location ~ ^/(auth|login|signup|forgot-password|verify-email)/ {
            limit_req zone=auth burst=5 nodelay;
            limit_conn conn 5;
            proxy_pass http://client:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(search|api/search|api/valuation|api/recommendations)/ {
            limit_req zone=search burst=10 nodelay;
            limit_conn conn 10;
            proxy_pass http://client:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 20;
            proxy_pass http://client:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://client:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Static caching ───────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://client:8080;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
